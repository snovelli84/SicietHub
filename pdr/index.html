<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SICIET PDR 125</title>
<meta name="theme-color" content="#005baa">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --brand:#005baa;--bg:#f4f6f9;--card:#fff;--text:#1d2430;--muted:#5d6878;--border:#e3e7ee;
  --chip:#e8eef6;--warn:#7a5600;--warn-bg:#fff4d6;--err:#b3261e;--err-bg:#fbe4e2;--ok:#1e7d3c;--ok-bg:#e0f3e6;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#11161d;--card:#1a212b;--text:#e8edf3;--muted:#9aa6b5;--border:#2a3340;--chip:#232c38;
  --warn:#f1d38a;--warn-bg:#3a3018;--err:#f2b8b5;--err-bg:#3a1d1b;--ok:#7fd59a;--ok-bg:#16301f;--shadow:0 2px 10px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.4}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:inline-flex;background:#fff;border-radius:10px;padding:4px 8px;line-height:0}
.logo img{height:40px;width:auto;display:block}
header h1{font-size:1.1rem;flex:1;min-width:180px}
header h1 small{display:block;font-weight:400;opacity:.85;font-size:.76rem}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:7px 12px;font-size:.85rem;cursor:pointer}
header .btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{color:var(--err)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
nav button{border:0;background:var(--chip);color:var(--text);padding:8px 14px;border-radius:999px;font-size:.88rem;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--brand);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:.95rem;margin-bottom:8px}
.alert{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.err{background:var(--err-bg);color:var(--err)}
.sec{margin:18px 0 8px;font-size:1rem}
.muted{color:var(--muted)}.small{font-size:.8rem}
.big{font-size:2rem;font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.ok i{background:var(--ok)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:600;background:var(--chip);white-space:nowrap}
.pill.si{background:var(--ok-bg);color:var(--ok)}.pill.no{background:var(--err-bg);color:var(--err)}
.pill.na{background:var(--chip);color:var(--muted)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.filtri{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filtri button,.filtri select{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 11px;border-radius:999px;font-size:.82rem;cursor:pointer}
.filtri button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ind{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.ind>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.ind>summary::-webkit-details-marker{display:none}
.ind .num{flex:none;min-width:2.3rem;font-weight:700;color:var(--brand)}
.ind .tt{flex:1;font-size:.9rem}
.ind .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ind .corpo{padding:0 14px 14px;border-top:1px solid var(--border)}
.ind .corpo>*{margin-top:12px}
label{display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:3px}
input,textarea,select{width:100%;font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{min-height:110px;resize:vertical}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stati{display:flex;gap:6px}
.stati label{flex:1;margin:0;text-align:center;border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;color:var(--text);font-size:.85rem}
.stati input{display:none}
.stati input:checked+span{font-weight:700}
.stati label:has(input:checked){background:var(--brand);color:#fff;border-color:var(--brand)}
.riga{display:grid;gap:6px;grid-template-columns:1fr 1.6fr auto;margin-bottom:6px}
.riga.r3{grid-template-columns:1fr 1fr 1.4fr auto}
@media(max-width:560px){.riga,.riga.r3{grid-template-columns:1fr 1fr}}
.faq{background:var(--chip);border-radius:8px;padding:8px 12px;font-size:.8rem}
.faq p{margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
#login{max-width:380px;margin:40px auto}
#login input{margin-bottom:10px}
footer{max-width:1100px;margin:0 auto;padding:10px 16px 30px;font-size:.75rem;color:var(--muted)}
.print-only{display:none}
.scheda .ar{margin-top:18px}
.scheda .ar h2{font-size:1rem;border-bottom:2px solid var(--brand);padding-bottom:4px;margin-bottom:8px}
.scheda .it{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;break-inside:avoid}
@media print{
  header,nav,footer,.noprint,#stato{display:none!important}
  body{background:#fff;color:#000;font-size:11px}
  .print-only{display:block}
  .card,.scheda .it{box-shadow:none}
  main{padding:0}
}
</style>
</head>
<body>
<header>
  <span class="logo"><img src="icons/logo.png" alt="SICIET"></span>
  <h1>PDR 125 – Parità di genere<small>Indicatori e evidenze per l'audit UNI/PdR 125:2022 · <span id="stato"></span></small></h1>
  <button class="btn" id="btnForget" hidden>Esci</button>
</header>

<section id="login" hidden>
  <div class="card">
    <h2>Accesso</h2>
    <div class="alert err" id="loginErr" hidden></div>
    <label for="nome">Il tuo nome</label>
    <input id="nome" autocomplete="name" placeholder="Nome e cognome">
    <label for="pwd">Password</label>
    <input id="pwd" type="password" autocomplete="current-password">
    <button class="btn primary" id="btnLogin">Entra</button>
    <p class="muted small" style="margin-top:10px">Il nome resta registrato accanto a ogni modifica.</p>
  </div>
</section>

<div id="app" hidden>
  <nav id="tabs"></nav>
  <main id="main"></main>
</div>
<footer id="ver"></footer>

<script src="indicatori.js"></script>
<script>
"use strict";
/* ---------- configurazione ---------- */
var PDR_CONFIG={
  // Indirizzo del servizio (Cloudflare Worker, vedi api/worker.js), es.
  // "https://siciet-pdr.<nome-account>.workers.dev/api".
  // Finché è vuoto la pagina funziona IN LOCALE: i dati restano solo sul dispositivo.
  api:"",
  secondi:30,
  // Punteggio minimo complessivo per la certificazione (UNI/PdR 125:2022): verificare con l'ente.
  soglia:60
};
const CFG=PDR_CONFIG;
// Versione della pagina: va aumentata a ogni modifica.
const VERSIONE="1.1",DATA_VERSIONE="27/11/2026";
const KEY="siciet_pdr_data_v1",KP="siciet_pdr_pwd",KN="siciet_pdr_nome",KQ="siciet_pdr_coda";
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlOk=u=>/^https?:\/\//i.test(String(u||"").trim());
const oggi=()=>new Date().toISOString().slice(0,10);
const fmtData=d=>d?d.split("-").reverse().join("/"):"";

/* ---------- dati ---------- */
const TUTTI=[];PDR_AREE.forEach(a=>a.ind.forEach(i=>{i.area=a.id;TUTTI.push(i)}));
const FASCE={1:"Fascia 1 – micro (fino a 9 persone)",2:"Fascia 2 – piccola (10–49)",3:"Fascia 3 – media (50–249)",4:"Fascia 4 – grande (250 e oltre)"};
// periodo di riferimento ricavato dal testo dell'indicatore (giorni oltre i quali l'evidenza è da rinnovare)
function finestra(i){
  const t=(i.testo+" "+(i.misura||"")).toLowerCase();
  if(/ultimo biennio/.test(t))return{giorni:730,nome:"ultimo biennio"};
  if(/ultimo anno|su base annua|anno su anno/.test(t))return{giorni:365,nome:"ultimo anno"};
  return null;
}
let D={ind:{},imp:{},evt:{},org:{}},anno=new Date().getFullYear(),evtEdit=null,filtroEvt="tutti",qCerca="",tab="quadro",areaSel="tutte",statoSel="tutti",aperti=new Set(),ultimo=0,timer=null,coda=[],stato="";
try{coda=JSON.parse(ls.get(KQ)||"[]")}catch(e){}
const operatore=()=>ls.get(KN)||"";
const rec=id=>D.ind[id]||{};
const fascia=()=>Number(D.imp.fascia)||0;
const applicabile=i=>(!fascia()||i.fasce.includes(fascia()))&&rec(i.id).stato!=="na";
const fuoriFascia=i=>fascia()&&!i.fasce.includes(fascia());

function applyVoce(v){
  const m=v.tipo==="ind"?D.ind:v.tipo==="evt"?D.evt:v.tipo==="org"?D.org:v.tipo==="imp"?null:undefined;
  if(m===undefined)return false;
  if(v.tipo==="imp"){const a=JSON.stringify(D.imp);D.imp=v.dati||{};return a!==JSON.stringify(D.imp)}
  const a=JSON.stringify(m[v.chiave]);
  if(v.dati===null)delete m[v.chiave];else m[v.chiave]=v.dati;
  return a!==JSON.stringify(m[v.chiave]);
}

/* ---------- archivio e sincronizzazione ---------- */
async function api(path,method,body){
  const h={"X-Password":ls.get(KP)||""};if(body!==undefined)h["Content-Type"]="application/json";
  let res;try{res=await fetch(CFG.api+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){const er=new Error("Nessuna connessione al servizio.");er.rete=true;throw er}
  let j={};try{j=await res.json()}catch(e){}
  if(res.status===401){ls.del(KP);const er=new Error(j.error||"Password non corretta.");er.auth=true;throw er}
  if(!res.ok)throw new Error(j.error||"Errore del servizio ("+res.status+").");
  return j;
}
function piede(){$("ver").textContent="SICIET PDR 125 · versione "+VERSIONE+" ("+DATA_VERSIONE+") · archivio: "+(CFG.api?"servizio condiviso":"solo questo dispositivo")}
function mostraStato(){
  piede();
  $("stato").textContent=!CFG.api?"modalità locale: dati solo su questo dispositivo":coda.length?"⏳ "+coda.length+" modifiche da inviare":stato||"✓ sincronizzato";
}
async function svuotaCoda(){
  while(coda.length){
    const parte=coda.slice(0,300);
    await api("/dati","POST",{voci:parte,operatore:operatore()});
    coda=coda.slice(parte.length);ls.set(KQ,JSON.stringify(coda));
  }
}
function salvaLocale(){if(!ls.set(KEY,JSON.stringify(D)))alert("Non c'è spazio per salvare i dati su questo dispositivo: scarica una copia con «Esporta».")}
function saveVoci(list){
  list.forEach(applyVoce);
  if(CFG.api){
    const k=v=>v.tipo+"|"+v.chiave,nuove=new Set(list.map(k));
    coda=coda.filter(v=>!nuove.has(k(v))).concat(list);ls.set(KQ,JSON.stringify(coda));
    mostraStato();
    svuotaCoda().then(mostraStato).catch(e=>{stato=e.auth?"":"⚠ "+e.message;mostraStato();if(e.auth)avvia()});
  }else salvaLocale();
}
async function sincronizza(){
  if(!CFG.api)return;
  try{
    await svuotaCoda();
    const j=await api("/dati?da="+ultimo,"GET");
    let c=false;j.voci.forEach(v=>{if(applyVoce(v))c=true});
    ultimo=Math.max(0,j.ora-5000);stato="";mostraStato();
    // non ridisegnare mentre qualcuno sta scrivendo in una scheda
    if(c&&!document.activeElement.closest("details.ind"))render();
  }catch(e){
    if(e.auth){clearInterval(timer);avvia()}else{stato="⚠ "+e.message;mostraStato()}
  }
}
function schermata(x){
  $("login").hidden=x!=="login";$("app").hidden=x!=="app";$("btnForget").hidden=x!=="app"||!CFG.api;
}
async function avvia(){
  clearInterval(timer);
  if(!CFG.api){
    try{const s=ls.get(KEY);if(s){const o=JSON.parse(s);D={ind:o.ind||{},imp:o.imp||{},evt:o.evt||{},org:o.org||{}}}}catch(e){}
    mostra();return;
  }
  if(!ls.get(KP)||!operatore()){mostraAccesso();return}
  try{
    const j=await api("/dati?da=0","GET");
    D={ind:{},imp:{},evt:{},org:{}};j.voci.forEach(applyVoce);ultimo=Math.max(0,j.ora-5000);
    coda.forEach(applyVoce);
    mostra();
    timer=setInterval(sincronizza,Math.max(10,CFG.secondi||30)*1000);
  }catch(e){
    mostraAccesso(e.auth?e.message:"");
    if(!e.auth){$("loginErr").hidden=false;$("loginErr").textContent=e.message}
  }
}
function mostraAccesso(msg){
  piede();schermata("login");
  $("nome").value=operatore();
  $("loginErr").hidden=!msg;$("loginErr").textContent=msg||"";
}
$("btnLogin").onclick=()=>{
  const n=$("nome").value.trim(),p=$("pwd").value;
  if(!n||!p){$("loginErr").hidden=false;$("loginErr").textContent="Inserisci nome e password.";return}
  ls.set(KN,n);ls.set(KP,p);$("pwd").value="";avvia();
};
$("pwd").addEventListener("keydown",e=>{if(e.key==="Enter")$("btnLogin").click()});
$("btnForget").onclick=()=>{ls.del(KP);ls.del(KN);clearInterval(timer);D={ind:{},imp:{},evt:{},org:{}};avvia()};

/* ---------- calcoli ---------- */
function punteggi(){
  let tot=0,pesoTot=0;
  const aree=PDR_AREE.map(a=>{
    const app=a.ind.filter(applicabile);
    const disp=app.reduce((s,i)=>s+i.punti,0);
    const ott=app.filter(i=>rec(i.id).stato==="si").reduce((s,i)=>s+i.punti,0);
    const pct=disp?ott/disp:null;
    if(pct!==null){tot+=a.peso*pct;pesoTot+=a.peso}
    const daFare=app.filter(i=>!rec(i.id).stato).length;
    return{a,disp,ott,pct,daFare,nApp:app.length};
  });
  // il totale è sul peso delle sole aree con indicatori applicabili, riportato su 100
  return{aree,totale:pesoTot?tot*100/pesoTot:null,pesoTot};
}
function scaduta(i){
  const r=rec(i.id),f=finestra(i);
  if(!f||r.stato!=="si")return null;
  if(!r.dataEvidenza)return"senza data";
  const g=(Date.now()-new Date(r.dataEvidenza).getTime())/864e5;
  return g>f.giorni?"oltre "+f.nome:null;
}
function revisioneScaduta(i){const r=rec(i.id);return r.revisione&&r.revisione<oggi()}
function problemi(i){
  const p=[],r=rec(i.id);
  if(fuoriFascia(i))return p;
  if(r.stato==="na")return p;
  if(!r.stato)p.push("da valutare");
  if(r.stato==="si"&&!(r.evidenze||"").trim()&&!(r.documenti||[]).length)p.push("manca l'evidenza");
  const s=scaduta(i);if(s)p.push(s==="senza data"?"data dell'evidenza mancante":"evidenza "+s);
  if(revisioneScaduta(i))p.push("revisione scaduta il "+fmtData(r.revisione));
  return p;
}
const pillStato=s=>s==="si"?'<span class="pill si">Soddisfatto</span>':s==="no"?'<span class="pill no">Non soddisfatto</span>':s==="na"?'<span class="pill na">N/A</span>':'<span class="pill warn">Da valutare</span>';

/* ---------- viste ---------- */
const TABS=[["quadro","Quadro"],["cerca","Rispondi all'audit"],["reg","Registro eventi"],["org","Organico"],["ind","Indicatori"],["scheda","Scheda per l'audit"],["dati","Azienda e dati"]];
function buildTabs(){
  $("tabs").innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" class="${k===tab?"on":""}">${n}</button>`).join("");
  $("tabs").insertAdjacentHTML("beforeend",`<select id="annoSel" style="width:auto;margin-left:auto;border-radius:999px" title="Anno di riferimento">${anniDisponibili().map(a=>`<option ${a===anno?"selected":""}>${a}</option>`).join("")}</select>`);
  $("annoSel").onchange=e=>{anno=Number(e.target.value);render()};
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;buildTabs();render();window.scrollTo(0,0)});
}
function render(){
  piede();
  const f={quadro:vQuadro,cerca:vCerca,reg:vReg,org:vOrg,ind:vInd,scheda:vScheda,dati:vDati}[tab];
  $("main").innerHTML=f();
  if(tab==="cerca")bindCerca();
  if(tab==="reg")bindReg();
  if(tab==="org")bindOrg();
  if(tab==="ind")bindInd();
  if(tab==="dati")bindDati();
  if(tab==="quadro")$("main").querySelectorAll("[data-vai]").forEach(b=>b.onclick=()=>{areaSel=b.dataset.vai;statoSel=b.dataset.st||"tutti";tab="ind";buildTabs();render();window.scrollTo(0,0)});
  const ld=$("main").querySelector("[data-dati]");if(ld)ld.onclick=e=>{e.preventDefault();tab="dati";buildTabs();render()};
  if(tab==="scheda")$("btnStampa").onclick=()=>window.print();
}
function mostra(){
  piede();schermata("app");mostraStato();buildTabs();render();
}

function vQuadro(){
  const p=punteggi(),avvisi=[];
  if(!fascia())avvisi.push('<div class="alert warn">Non è ancora stata indicata la <b>fascia dimensionale</b> dell\'azienda: i punteggi considerano tutti gli indicatori. Si imposta in <a href="#" data-dati>Azienda e dati</a>.</div>');
  const prob=TUTTI.filter(i=>!fuoriFascia(i)).map(i=>({i,p:problemi(i)})).filter(x=>x.p.length);
  const ok=p.totale!==null&&p.totale>=CFG.soglia;
  let h=avvisi.join("");
  h+=`<div class="grid"><div class="card"><h2>Punteggio complessivo (stima)</h2>
    <div class="big">${p.totale===null?"–":p.totale.toFixed(0)+" / 100"}</div>
    <div class="bar ${ok?"ok":""}"><i style="width:${p.totale||0}%"></i></div>
    <p class="small muted">${p.totale===null?"Nessun indicatore valutato.":ok?"Sopra la soglia di "+CFG.soglia+"%.":"Sotto la soglia di "+CFG.soglia+"% richiesta per la certificazione."} Conta solo ciò che è segnato «Soddisfatto»; i N/A sono esclusi. È una stima per prepararsi: il giudizio è dell'ente di certificazione.</p></div>
    <div class="card"><h2>Stato degli indicatori${fascia()?" – "+FASCE[fascia()].split(" – ")[0]:""}</h2>${(()=>{
      const l=TUTTI.filter(i=>!fuoriFascia(i)),c=s=>l.filter(i=>(rec(i.id).stato||"")===s).length;
      return `<table><tr><td>Soddisfatti</td><td><b>${c("si")}</b></td></tr><tr><td>Non soddisfatti</td><td><b>${c("no")}</b></td></tr><tr><td>Non applicabili</td><td><b>${c("na")}</b></td></tr><tr><td>Da valutare</td><td><b>${c("")}</b></td></tr></table>
      <p class="small muted" style="margin-top:6px">Su ${l.length} indicatori${fascia()?" applicabili alla fascia":""}.</p>`})()}</div>
    <div class="card"><h2>Da sistemare</h2><div style="font-size:2rem;font-weight:700">${prob.length}</div><p class="small muted">indicatori con evidenze mancanti, scadute o da valutare.</p></div></div>`;
  h+=`<h2 class="sec">Aree</h2><div class="grid">`+p.aree.map(x=>`<div class="card"><h2>${esc(x.a.nome)}</h2>
    <p class="small muted">Peso ${x.a.peso}% · ${x.nApp} indicatori applicabili</p>
    <div class="big" style="font-size:1.5rem">${x.pct===null?"–":Math.round(x.pct*100)+"%"}</div>
    <div class="bar"><i style="width:${(x.pct||0)*100}%"></i></div>
    <p class="small">${x.ott} / ${x.disp} punti${x.daFare?` · <b>${x.daFare}</b> da valutare`:""}</p>
    <button class="btn" style="margin-top:8px" data-vai="${x.a.id}">Apri indicatori</button></div>`).join("")+`</div>`;
  if(prob.length){

/* ---------- registro eventi, organico, KPI calcolati ---------- */
const TIPI_EVT={
  assunzione:["Assunzione",["hr.1"]],cessazione:["Cessazione / dimissioni",["hr.2"]],
  promozione:["Promozione / avanzamento",["equita.2","hr.4"]],
  congedo_pat:["Congedo di paternità obbligatorio",["genitorialita.5","genitorialita.4"]],
  congedo_par:["Congedo parentale",["genitorialita.4","genitorialita.3"]],
  maternita:["Maternità / rientro",["hr.5","genitorialita.1","genitorialita.3"]],
  flex:["Part-time, smart working, conciliazione",["genitorialita.2","genitorialita.1"]],
  formazione:["Formazione",["cultura.5","hr.3"]],indagine:["Indagine su percezione / clima",["cultura.2","cultura.6"]],
  comunicazione:["Comunicazione interna / sensibilizzazione",["cultura.3"]],esterno:["Iniziativa esterna / stakeholder",["cultura.7"]],
  segnalazione:["Segnalazione (molestie, mobbing, non inclusività)",["governance.2","hr.6"]],
  governance:["Governance: nomina, comitato, budget, obiettivi",["governance.1","governance.3","governance.4","cultura.1"]],
  altro:["Altro",[]]
};
const evtAll=()=>Object.values(D.evt).sort((a,b)=>b.data.localeCompare(a.data));
const evtTipo=(t,y0,y1)=>evtAll().filter(e=>e.tipo===t&&(y0===undefined||(+e.data.slice(0,4)>=y0&&+e.data.slice(0,4)<=(y1===undefined?y0:y1))));
const somma=(l,k)=>l.reduce((s,e)=>s+(Number(e[k])||0),0);
const P=x=>x===null||x===undefined||isNaN(x)?"–":(x*100).toFixed(1).replace(".",",")+"%";
const PP=d=>(d>=0?"+":"")+(d*100).toFixed(1).replace(".",",")+" pp";
const quota=(f,m)=>(+f||0)+(+m||0)>0?(+f||0)/((+f||0)+(+m||0)):null;
function orgTot(o){let F=0,M=0;(o.righe||[]).forEach(r=>{F+=+r.F||0;M+=+r.M||0});return{F,M,t:F+M}}
function precedente(y){for(const d of [2,1])if(D.org[y-d])return{o:D.org[y-d],anno:y-d};return null}
function anniDisponibili(){
  const s=new Set([new Date().getFullYear(),anno]);
  Object.keys(D.org).forEach(k=>s.add(+k));Object.values(D.evt).forEach(e=>s.add(+e.data.slice(0,4)));
  return [...s].filter(Boolean).sort((a,b)=>b-a);
}
// risultato calcolato dai dati: { v: testo, ok: true|false|null }
function kpi(id,y){
  const o=D.org[y],pv=precedente(y),mancaOrg={v:"Mancano i dati dell'organico "+y+" (scheda Organico).",ok:null};
  const conf=(q,rif,etichetta)=>q===null||rif===null||rif===undefined?null:q-rif;
  switch(id){
  case"crescita.1":{if(!o)return mancaOrg;const t=orgTot(o),q=quota(t.F,t.M);
    const d=pv?q-quota(orgTot(pv.o).F,orgTot(pv.o).M):null;
    return{v:`Donne ${P(q)} (${t.F} su ${t.t}); ${d===null?"nessun anno precedente inserito":PP(d)+" rispetto al "+pv.anno}`,ok:d===null?null:(q>=.5||d>=.1)}}
  case"crescita.2":{if(!o)return mancaOrg;const t=orgTot(o),q=quota(t.F,t.M);if(o.istatD===undefined||o.istatD==="")return{v:`Donne ${P(q)}; manca il dato Istat del settore (scheda Organico).`,ok:null};
    const d=q-o.istatD/100,cr=pv?q>=quota(orgTot(pv.o).F,orgTot(pv.o).M):true;
    return{v:`Donne ${P(q)} contro ${P(o.istatD/100)} del settore (${PP(d)}); ${cr?"in crescita o stabile":"in calo"} sul ${pv?pv.anno:"periodo precedente"}`,ok:d>=.1&&cr}}
  case"crescita.3":{if(!o)return mancaOrg;const n=(+o.dirF||0)+(+o.dirM||0);if(!n)return{v:"Nessun dirigente in organico: indicatore non soddisfatto (FAQ). Se si applica il caso «primo riporto dell'amministratore», registrare quelle persone come dirigenti.",ok:false};
    const q=quota(o.dirF,o.dirM),d=pv&&((+pv.o.dirF||0)+(+pv.o.dirM||0))?q-quota(pv.o.dirF,pv.o.dirM):null;
    return{v:`Donne dirigenti ${P(q)} (${o.dirF||0} su ${n}); ${d===null?"nessun anno precedente":PP(d)+" rispetto al "+pv.anno}`,ok:d===null?null:(q>=.5||d>=.1)}}
  case"crescita.4":case"crescita.6":case"crescita.7":{if(!o)return mancaOrg;
    const[f,m,nome]=id==="crescita.4"?[o.dirF,o.dirM,"dirigenti"]:id==="crescita.6"?[o.lineaF,o.lineaM,"prima linea di riporto"]:[o.budF,o.budM,"con delega di budget"];
    if(!((+f||0)+(+m||0)))return{v:`Nessun dato sulle donne ${nome} nel ${y}.`,ok:id==="crescita.4"?false:null};
    if(o.istatDir===undefined||o.istatDir==="")return{v:`Donne ${nome} ${P(quota(f,m))}; manca il dato Istat sulle dirigenti del settore.`,ok:null};
    const q=quota(f,m),d=q-o.istatDir/100;
    return{v:`Donne ${nome} ${P(q)} (${f||0} su ${(+f||0)+(+m||0)}) contro ${P(o.istatDir/100)} delle dirigenti del settore (${PP(d)})`,ok:d>=.1}}
  case"crescita.5":{if(!o)return mancaOrg;if(!((+o.respF||0)+(+o.respM||0)))return{v:"Nessun dato sui responsabili di unità.",ok:null};
    const q=quota(o.respF,o.respM),cr=pv?q>=quota(pv.o.respF,pv.o.respM):true;
    return{v:`Donne responsabili ${P(q)} (${o.respF||0} su ${(+o.respF||0)+(+o.respM||0)}); ${cr?"in crescita o stabile":"in calo"}`,ok:q>=.4&&cr}}
  case"equita.1":{if(!o)return mancaOrg;const r=(o.righe||[]).filter(r=>+r.F>0&&+r.M>0&&+r.retrF>0&&+r.retrM>0);
    if(!r.length)return{v:"Mancano le retribuzioni medie per livello (scheda Organico).",ok:null};
    const g=r.map(x=>({l:x.livello,g:(x.retrM-x.retrF)/x.retrM})),peggio=g.reduce((a,b)=>Math.abs(b.g)>Math.abs(a.g)?b:a);
    return{v:"Differenza M-D per livello: "+g.map(x=>`${x.l} ${P(x.g)}`).join(" · ")+` (massima: ${P(Math.abs(peggio.g))}; soglia 10% su ogni livello)`,ok:g.every(x=>Math.abs(x.g)<.1)}}
  case"equita.2":{const pr=evtTipo("promozione",y);const pF=somma(pr,"nF"),pM=somma(pr,"nM");
    if(!pF&&!pM)return{v:`Nessuna promozione registrata nel ${y}: l'indicatore non è soddisfatto (FAQ).`,ok:false};
    if(!o)return{v:`Promozioni ${y}: donne ${pF}, uomini ${pM}. `+mancaOrg.v,ok:null};
    const t=orgTot(o),rF=t.F?pF/t.F:null,rM=t.M?pM/t.M:null;
    return{v:`Promosse ${pF} donne su ${t.F} (${P(rF)}) · promossi ${pM} uomini su ${t.M} (${P(rM)})`,ok:rF!==null&&rM!==null?rF>=rM:null}}
  case"equita.3":{if(!o)return mancaOrg;if(o.varF===undefined||o.varF===""||o.varM===undefined||o.varM==="")return{v:"Mancano le persone con retribuzione variabile (scheda Organico).",ok:null};
    const t=orgTot(o),rF=t.F?o.varF/t.F:null,rM=t.M?o.varM/t.M:null;
    return{v:`Con variabile: donne ${o.varF} su ${t.F} (${P(rF)}) · uomini ${o.varM} su ${t.M} (${P(rM)})`,ok:rF!==null&&rM!==null?rF>=rM:null}}
  case"hr.1":{const a=evtTipo("assunzione",y);return{v:`Assunzioni ${y}: ${somma(a,"nF")} donne, ${somma(a,"nM")} uomini`,ok:null}}
  case"hr.2":{const c=evtTipo("cessazione",y),cF=somma(c,"nF"),cM=somma(c,"nM");
    if(!o)return{v:`Cessazioni ${y}: ${cF} donne, ${cM} uomini. `+mancaOrg.v,ok:null};
    const t=orgTot(o);return{v:`Turnover in uscita ${y}: donne ${cF} su ${t.F} (${P(t.F?cF/t.F:null)}) · uomini ${cM} su ${t.M} (${P(t.M?cM/t.M:null)})`,ok:null}}
  case"genitorialita.4":{const c=evtTipo("congedo_par",y),b=somma(c,"nM");
    if(!o||!(+o.padri>0))return{v:`Padri che hanno usufruito del congedo parentale nel ${y}: ${b}. Manca il numero di padri con diritto (scheda Organico).`,ok:null};
    const q=b/o.padri;return{v:`Padri beneficiari ${b} su ${o.padri} aventi diritto (${P(q)}); soglia indicativa 90% («prossimo al 100%»)`,ok:q>=.9}}
  case"genitorialita.5":{const c=evtTipo("congedo_pat",y);if(!c.length)return{v:`Nessun congedo di paternità registrato nel ${y}.`,ok:null};
    const pers=somma(c,"nM")||c.length,gg=c.reduce((s,e)=>s+(Number(e.giorni)||0)*(Number(e.nM)||1),0)/pers,q=gg/10;
    return{v:`Media ${gg.toFixed(1).replace(".",",")} giorni su 10 previsti (${P(q)}) per ${pers} padri; soglia indicativa 90%`,ok:q>=.9}}
  case"cultura.3":{const e=evtTipo("comunicazione",y);return{v:`${e.length} ${e.length===1?"iniziativa":"iniziative"} di comunicazione/sensibilizzazione nel ${y}`+(e[0]?` (ultima: ${fmtData(e[0].data)} – ${e[0].titolo||""})`:""),ok:e.length>0}}
  case"cultura.5":{const e=evtTipo("formazione",y-1,y),n=somma(e,"nF")+somma(e,"nM"),t=o?orgTot(o).t:0;
    if(!e.length)return{v:`Nessuna formazione registrata nel biennio ${y-1}–${y}.`,ok:false};
    return{v:`${e.length} ${e.length===1?"intervento":"interventi"} nel biennio ${y-1}–${y}, ${n} partecipazioni`+(t?` su ${t} persone in organico (${P(n/t)}); l'indicatore richiede tutto il personale`:""),ok:t?n>=t*.95:null}}
  case"cultura.6":{const e=evtTipo("indagine",y);return{v:e.length?`${e.length} indagini nel ${y}; ultima il ${fmtData(e[0].data)} – ${e[0].titolo||""}`:`Nessuna indagine sulla percezione registrata nel ${y}.`,ok:e.length>0}}
  case"cultura.7":{const e=evtTipo("esterno",y-1,y);return{v:e.length?`${e.length} iniziative esterne nel biennio ${y-1}–${y}; ultima il ${fmtData(e[0].data)} – ${e[0].titolo||""}`:`Nessuna iniziativa esterna registrata nel biennio ${y-1}–${y}.`,ok:e.length>0}}
  case"governance.2":case"hr.6":{const e=evtTipo("segnalazione",y);return{v:`${e.length} segnalazioni registrate nel ${y}`,ok:null}}
  }
  return null;
}
function boxCalcolo(i){
  const k=kpi(i.id,anno),col=[];
  Object.keys(TIPI_EVT).forEach(t=>{if(TIPI_EVT[t][1].includes(i.id))col.push(t)});
  const ev=evtAll().filter(e=>col.includes(e.tipo)).slice(0,5);
  if(!k&&!col.length)return"";
  return `<div class="faq" style="border-left:4px solid ${k&&k.ok===true?"var(--ok)":k&&k.ok===false?"var(--err)":"var(--brand)"}">
    ${k?`<b>Dato calcolato (${anno}):</b> ${esc(k.v)} ${k.ok===true?'<span class="pill si">obiettivo raggiunto</span>':k.ok===false?'<span class="pill no">obiettivo non raggiunto</span>':""}`:""}
    ${col.length?`<p><b>Eventi collegati</b> (${col.map(t=>esc(TIPI_EVT[t][0])).join(", ")}): ${ev.length?ev.map(e=>`${fmtData(e.data)} ${esc(e.titolo||TIPI_EVT[e.tipo][0])}`).join(" · "):"nessuno ancora registrato"}</p>`:""}</div>`;
}

/* --- registro --- */
function vReg(){
  let l=evtAll().filter(e=>filtroEvt==="tutti"||e.tipo===filtroEvt);
  l=l.filter(e=>+e.data.slice(0,4)===anno);
  let h=`<div class="alert warn noprint">Registra solo <b>genere e livello</b>, mai nomi o dati personali: bastano per calcolare gli indicatori.</div>
  <div class="filtri"><button class="btn primary" id="btnNuovoEvt">＋ Nuovo evento</button>
  <select id="fEvt"><option value="tutti">Tutti i tipi</option>${Object.keys(TIPI_EVT).map(t=>`<option value="${t}" ${filtroEvt===t?"selected":""}>${esc(TIPI_EVT[t][0])}</option>`).join("")}</select>
  <span class="small muted">Anno ${anno}: ${l.length} eventi</span></div>`;
  if(evtEdit)h+=formEvt(evtEdit==="new"?{data:oggi(),tipo:filtroEvt==="tutti"?"formazione":filtroEvt}:D.evt[evtEdit]);
  h+=l.length?`<div class="card" style="overflow-x:auto"><table><tr><th>Data</th><th>Tipo</th><th>Titolo</th><th>Donne</th><th>Uomini</th><th>Livello</th><th>Doc.</th><th></th></tr>`+l.map(e=>`<tr><td>${fmtData(e.data)}</td><td>${esc((TIPI_EVT[e.tipo]||["?"])[0])}</td><td>${esc(e.titolo)}${e.nota?`<div class="small muted">${esc(e.nota)}</div>`:""}</td><td>${e.nF||""}</td><td>${e.nM||""}</td><td>${esc(e.livello)}</td><td>${urlOk(e.url)?`<a href="${esc(e.url)}" target="_blank" rel="noopener">link</a>`:""}</td><td style="white-space:nowrap"><button class="btn" data-modif="${esc(e.id)}">Modifica</button></td></tr>`).join("")+`</table></div>`:'<p class="muted">Nessun evento registrato per questo anno e questo tipo.</p>';
  return h;
}
function formEvt(e){
  const livelli=[...new Set(Object.values(D.org).flatMap(o=>(o.righe||[]).map(r=>r.livello)).filter(Boolean))];
  return `<div class="card noprint" id="frmEvt" style="margin-bottom:14px"><h2>${e.id?"Modifica evento":"Nuovo evento"}</h2>
   <div class="row"><div><label>Data</label><input type="date" id="e-data" value="${esc(e.data)}"></div>
   <div><label>Tipo</label><select id="e-tipo">${Object.keys(TIPI_EVT).map(t=>`<option value="${t}" ${e.tipo===t?"selected":""}>${esc(TIPI_EVT[t][0])}</option>`).join("")}</select></div>
   <div><label>Donne coinvolte (n.)</label><input type="number" min="0" id="e-nF" value="${esc(e.nF||"")}"></div>
   <div><label>Uomini coinvolti (n.)</label><input type="number" min="0" id="e-nM" value="${esc(e.nM||"")}"></div>
   <div><label>Livello / qualifica</label><input id="e-liv" list="liv" value="${esc(e.livello)}"><datalist id="liv">${livelli.map(l=>`<option>${esc(l)}`).join("")}</datalist></div>
   <div><label>Giorni di congedo (per persona)</label><input type="number" min="0" id="e-gg" value="${esc(e.giorni||"")}"></div></div>
   <div style="margin-top:10px"><label>Titolo (es. «Corso bias inconsci – tutto il personale»)</label><input id="e-titolo" value="${esc(e.titolo)}"></div>
   <div class="row" style="margin-top:10px"><div><label>Documento (link SharePoint, attestati, verbale…)</label><input id="e-url" placeholder="https://…" value="${esc(e.url)}"></div>
   <div><label>Note</label><input id="e-nota" value="${esc(e.nota)}"></div></div>
   <p class="small muted" style="margin-top:6px">Per un singolo evento (una promozione, un'assunzione, un congedo) indica 1 nella colonna del genere. Il tipo decide a quali indicatori il dato contribuisce.</p>
   <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn primary" id="e-salva">Salva</button><button class="btn" id="e-annulla">Annulla</button>${e.id?'<button class="btn danger" id="e-elimina">Elimina</button>':""}</div></div>`;
}
function bindReg(){
  $("btnNuovoEvt").onclick=()=>{evtEdit="new";render();$("frmEvt").scrollIntoView()};
  $("fEvt").onchange=e=>{filtroEvt=e.target.value;render()};
  $("main").querySelectorAll("[data-modif]").forEach(b=>b.onclick=()=>{evtEdit=b.dataset.modif;render();$("frmEvt").scrollIntoView()});
  if(!evtEdit)return;
  $("e-annulla").onclick=()=>{evtEdit=null;render()};
  if($("e-elimina"))$("e-elimina").onclick=()=>{if(!confirm("Eliminare questo evento?"))return;saveVoci([{tipo:"evt",chiave:evtEdit,dati:null}]);evtEdit=null;render()};
  $("e-salva").onclick=()=>{
    const e={data:$("e-data").value,tipo:$("e-tipo").value,nF:Number($("e-nF").value)||0,nM:Number($("e-nM").value)||0,livello:$("e-liv").value.trim(),giorni:Number($("e-gg").value)||0,titolo:$("e-titolo").value.trim(),url:$("e-url").value.trim(),nota:$("e-nota").value.trim()};
    if(!e.data){alert("Indica la data.");return}
    if(e.url&&!urlOk(e.url)){alert("Il collegamento deve iniziare con http:// o https://");return}
    e.id=evtEdit==="new"?Date.now().toString(36)+Math.random().toString(36).slice(2,6):evtEdit;
    e.aggiornato=new Date().toISOString();e.da=operatore();
    saveVoci([{tipo:"evt",chiave:e.id,dati:e}]);
    anno=+e.data.slice(0,4);evtEdit=null;buildTabs();render();toast("Evento salvato");
  };
}

/* --- organico --- */
const CAMPI_ORG=[["dirF","dirM","Dirigenti (o primo riporto dell'amministratore, vedi FAQ)"],["respF","respM","Responsabili di unità organizzative"],["lineaF","lineaM","Prima linea di riporto al vertice"],["budF","budM","Con delega su un budget di spesa/investimento"],["varF","varM","Con retribuzione variabile target"]];
function vOrg(){
  const o=D.org[anno]||{righe:[]},righe=o.righe&&o.righe.length?o.righe:[{}];
  const t=orgTot(o);
  return `<div class="card"><h2>Organico ${anno}</h2>
  <p class="small muted" style="margin-bottom:10px">Dati aggregati sulle <b>teste</b> che hanno composto l'organico nell'anno (compresi part-time, co.co.co. e amministratori; esclusi liberi professionisti e occasionali), come da FAQ. Dall'anno prima in poi si calcolano le variazioni.</p>
  <label>Per livello di inquadramento</label>
  <div class="small muted" style="display:grid;grid-template-columns:1.6fr repeat(4,1fr) 2.6rem;gap:6px;margin-bottom:2px"><span>Livello</span><span>Donne (n.)</span><span>Uomini (n.)</span><span>Retr. media donne</span><span>Retr. media uomini</span><span></span></div><div id="righeOrg">${righe.map(rigaOrg).join("")}</div>
  <button class="btn" id="addRigaOrg" type="button">＋ Livello</button> <span class="small muted">Totale: ${t.F} donne · ${t.M} uomini${t.t?" · "+P(t.F/t.t)+" donne":""}</span>
  <h2 style="margin-top:16px">Ruoli e retribuzione variabile</h2>
  <div style="overflow-x:auto"><table><tr><th></th><th>Donne</th><th>Uomini</th></tr>${CAMPI_ORG.map(([a,b,n])=>`<tr><td>${esc(n)}</td><td><input type="number" min="0" data-o="${a}" value="${esc(o[a]??"")}"></td><td><input type="number" min="0" data-o="${b}" value="${esc(o[b]??"")}"></td></tr>`).join("")}</table></div>
  <div class="row" style="margin-top:10px">
   <div><label>Padri con diritto al congedo parentale (n.)</label><input type="number" min="0" data-o="padri" value="${esc(o.padri??"")}"></div>
   <div><label>Istat: % donne nel settore (ATECO)</label><input type="number" step="0.1" data-o="istatD" value="${esc(o.istatD??"")}"></div>
   <div><label>Istat: % donne dirigenti nel settore</label><input type="number" step="0.1" data-o="istatDir" value="${esc(o.istatDir??"")}"></div></div>
  <p class="small muted" style="margin-top:6px">I dati Istat si chiedono su contact.istat.it e vanno aggiornati a ogni audit (riferiti ai due anni precedenti).</p>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="btnOrg">Salva organico ${anno}</button>${D.org[anno]?'<button class="btn danger" id="btnOrgDel">Elimina anno</button>':""}</div></div>
  ${tabKpi()}`;
}
const rigaOrg=r=>`<div class="riga" style="grid-template-columns:1.6fr repeat(4,1fr) auto;align-items:center"><input data-r="livello" placeholder="Livello (es. 5° livello)" value="${esc(r.livello)}"><input type="number" min="0" data-r="F" placeholder="Donne" value="${esc(r.F??"")}"><input type="number" min="0" data-r="M" placeholder="Uomini" value="${esc(r.M??"")}"><input type="number" min="0" data-r="retrF" placeholder="Retr. media D" value="${esc(r.retrF??"")}"><input type="number" min="0" data-r="retrM" placeholder="Retr. media U" value="${esc(r.retrM??"")}"><button class="btn danger" data-delr type="button">✕</button></div>`;
function tabKpi(){
  const ids=TUTTI.map(i=>i.id).filter(id=>kpi(id,anno));
  return `<h2 class="sec">Indicatori calcolati – ${anno}</h2><div class="card"><table>`+ids.map(id=>{const k=kpi(id,anno),i=TUTTI.find(x=>x.id===id);return `<tr><td style="width:5rem"><b>${esc(id)}</b></td><td>${esc(i.testo.length>70?i.testo.slice(0,70)+"…":i.testo)}</td><td>${esc(k.v)}</td><td>${k.ok===true?'<span class="pill si">ok</span>':k.ok===false?'<span class="pill no">no</span>':'<span class="pill na">–</span>'}</td></tr>`}).join("")+`</table></div>`;
}
function bindOrg(){
  const c=$("righeOrg");
  $("addRigaOrg").onclick=()=>c.insertAdjacentHTML("beforeend",rigaOrg({}));
  c.addEventListener("click",e=>{if(e.target.dataset.delr!==undefined)e.target.closest(".riga").remove()});
  $("btnOrg").onclick=()=>{
    const o={anno,righe:[...c.querySelectorAll(".riga")].map(r=>{const x={};r.querySelectorAll("[data-r]").forEach(el=>x[el.dataset.r]=el.dataset.r==="livello"?el.value.trim():(el.value===""?"":Number(el.value)));return x}).filter(x=>x.livello||x.F||x.M)};
    $("main").querySelectorAll("[data-o]").forEach(el=>o[el.dataset.o]=el.value===""?"":Number(el.value));
    o.aggiornato=new Date().toISOString();o.da=operatore();
    saveVoci([{tipo:"org",chiave:String(anno),dati:o}]);toast("Organico "+anno+" salvato");render();
  };
  if($("btnOrgDel"))$("btnOrgDel").onclick=()=>{if(confirm("Eliminare i dati dell'organico "+anno+"?")){saveVoci([{tipo:"org",chiave:String(anno),dati:null}]);render()}};
}

/* --- risposte rapide --- */
function risposte(y){
  const o=D.org[y],t=o?orgTot(o):null,out=[];
  const ult=(tp)=>{const e=evtTipo(tp)[0];return e?`${fmtData(e.data)} – ${esc(e.titolo||TIPI_EVT[tp][0])}${urlOk(e.url)?` <a href="${esc(e.url)}" target="_blank" rel="noopener">documento</a>`:""}`:null};
  const k=id=>{const r=kpi(id,y);return r?esc(r.v):null};
  const R=(q,a,cerca)=>out.push({q,a:a||'<span class="muted">Dato non ancora inserito.</span>',cerca:(q+" "+(cerca||"")).toLowerCase()});
  R("Quando avete fatto l'ultima formazione su differenze di genere e bias?",ult("formazione"),"formazione corso bias stereotipi");
  R("La formazione ha coinvolto tutto il personale nell'ultimo biennio?",k("cultura.5"),"formazione biennio personale");
  R("Quando è stata fatta l'ultima indagine sulla percezione delle pari opportunità?",ult("indagine"),"indagine clima percezione questionario");
  R("Quali iniziative avete fatto per la comunicazione interna e verso l'esterno?",(k("cultura.3")||"")+(k("cultura.7")?"<br>"+k("cultura.7"):"")||null,"comunicazione sensibilizzazione esterno stakeholder");
  R("Qual è la percentuale di donne in organico e come è cambiata?",k("crescita.1"),"donne organico percentuale");
  R("Quante donne sono dirigenti / responsabili / in prima linea?",[k("crescita.3"),k("crescita.5"),k("crescita.6")].filter(Boolean).join("<br>")||null,"dirigenti responsabili prima linea");
  R("Quante assunzioni e cessazioni ci sono state e qual è il turnover per genere?",[k("hr.1"),k("hr.2")].filter(Boolean).join("<br>"),"assunzioni cessazioni turnover");
  R("Quante promozioni per genere?",k("equita.2"),"promozioni avanzamenti");
  R("Qual è la differenza retributiva tra donne e uomini a parità di livello?",k("equita.1"),"retribuzione gap stipendio livello");
  R("Chi ha la retribuzione variabile, per genere?",k("equita.3"),"variabile premio");
  R("Quanti padri hanno usufruito di congedi parentali e di paternità?",[k("genitorialita.4"),k("genitorialita.5")].filter(Boolean).join("<br>"),"congedo paternità parentale padri");
  R("Come sono state gestite le segnalazioni di molestie, mobbing o non inclusività?",k("governance.2")+(ult("segnalazione")?"<br>Ultima: "+ult("segnalazione"):""),"segnalazione molestie mobbing");
  R("Chi presidia i temi di parità di genere e che budget c'è?",ult("governance"),"governance comitato referente budget obiettivi presidio");
  return out;
}
function vCerca(){
  return `<div class="card"><h2>Rispondi all'audit – ${anno}</h2><input id="q" type="search" placeholder="Cerca: formazione, promozioni, congedo, retribuzione, segnalazioni…" value="${esc(qCerca)}" autofocus>
  <p class="small muted" style="margin-top:6px">Cerca in risposte rapide, eventi registrati ed evidenze degli indicatori. Anno di riferimento: ${anno} (selettore in alto a destra).</p></div><div id="risCerca"></div>`;
}
function bindCerca(){
  const disegna=()=>{
    const q=qCerca.trim().toLowerCase(),ris=risposte(anno).filter(r=>!q||r.cerca.includes(q)||q.split(/\s+/).every(w=>r.cerca.includes(w)));
    let h=ris.map(r=>`<div class="card" style="margin-top:10px"><b>${esc(r.q)}</b><p style="margin-top:6px">${r.a}</p></div>`).join("");
    if(q){
      const ev=evtAll().filter(e=>[e.titolo,e.nota,e.livello,TIPI_EVT[e.tipo]&&TIPI_EVT[e.tipo][0],e.data].join(" ").toLowerCase().includes(q)).slice(0,30);
      if(ev.length)h+=`<h2 class="sec">Eventi registrati</h2><div class="card"><table>`+ev.map(e=>`<tr><td>${fmtData(e.data)}</td><td>${esc(TIPI_EVT[e.tipo][0])}</td><td>${esc(e.titolo)}</td><td>${e.nF||0} D · ${e.nM||0} U</td><td>${urlOk(e.url)?`<a href="${esc(e.url)}" target="_blank" rel="noopener">link</a>`:""}</td></tr>`).join("")+`</table></div>`;
      const ind=TUTTI.filter(i=>(i.testo+" "+(rec(i.id).evidenze||"")+" "+(rec(i.id).documenti||[]).map(d=>d.titolo).join(" ")).toLowerCase().includes(q)).slice(0,20);
      if(ind.length)h+=`<h2 class="sec">Indicatori</h2><div class="card"><table>`+ind.map(i=>`<tr><td><b>${esc(i.id)}</b></td><td>${esc(i.testo)}</td><td>${pillStato(rec(i.id).stato||"")}</td></tr>`).join("")+`</table></div>`;
      if(!h)h='<p class="muted" style="margin-top:10px">Nessun risultato.</p>';
    }
    $("risCerca").innerHTML=h;
  };
  $("q").oninput=e=>{qCerca=e.target.value;disegna()};disegna();
}

avvia();
</script>
</body>
</html>
