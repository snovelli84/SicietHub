<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MailStore SICIET</title>
<!-- Pannello del componente aggiuntivo di Outlook (vedi manifest.xml) -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --brand:#005baa;
  --brand-dark:#00457f;
  --bg:#ffffff;
  --text:#1d2430;
  --muted:#5d6878;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a212b;
    --text:#e8edf3;
    --muted:#9aa6b5;
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px 16px;
  background:var(--bg);
  color:var(--text);
  font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  text-align:center;
}
img{width:64px;height:64px;margin:8px auto 12px;display:block}
h1{font-size:18px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted)}
.btn{
  display:block;
  padding:12px 16px;
  border-radius:8px;
  background:var(--brand);
  color:#fff;
  font-weight:600;
  text-decoration:none;
}
.btn:hover,.btn:focus-visible{background:var(--brand-dark)}
.note{margin-top:16px;font-size:13px}
</style>
</head>
<body>
<img src="icon-128.png" alt="">
<h1>MailStore SICIET</h1>
<p>Archivio della posta aziendale: ricerca e consultazione delle email archiviate.</p>
<a class="btn" href="https://mailstore.siciet.it" target="_blank" rel="noopener">Apri archivio MailStore</a>
<p class="note">Si apre in una nuova scheda. Dall'esterno è raggiungibile solo da connessioni italiane.</p>
<script>
if (window.Office) Office.onReady(function () {});
</script>
</body>
</html>
