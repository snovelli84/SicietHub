<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SICIET HUB</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#005baa;
    color:white;
    text-align:center;
    padding:25px;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:10px;
}

.container{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px 15px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.icon{
    font-size:50px;
}

.icon img{
    width:50px;
    height:auto;
}

.title{
    margin-top:10px;
    font-weight:bold;
    color:#333;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
    font-size:12px;
}

</style>

</head>

<body>

<header>
    <h1>SICIET</h1>
    <p>Portale Applicazioni Aziendali</p>
</header>

<div class="container">

    <div class="grid">

        <div class="card" onclick="openPerfetto()">
            <div class="icon">
                <img src="https://play-lh.googleusercontent.com/jQ2J1DkQmT1AyLmUgCqx0ZXNmLcVQs7iFmgTIgfs-ZI6kJ6aI4UNcAtmMSjCgdbNuLgKnIFcobB0z-Cxf0SZ=w240-h480-rw"
                     alt="Perfetto"
                     onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'📊',style:'font-size:50px'}))"/>
            </div>
            <div class="title">PerfettoApp</div>
        </div>

        <div class="card" onclick="openZConnect()">
            <div class="icon">💰</div>
            <div class="title">ZConnect</div>
        </div>

        <div class="card" onclick="openOutlook()">
            <div class="icon">📧</div>
            <div class="title">Outlook</div>
        </div>

        <div class="card" onclick="openTeams()">
            <div class="icon">💬</div>
            <div class="title">Teams</div>
        </div>

        <div class="card" onclick="openAuthPoint()">
            <div class="icon">🔐</div>
            <div class="title">AuthPoint</div>
        </div>

    </div>

</div>

<footer>
    SICIET HUB
</footer>

<script>

function isIOS(){
    return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

/* Prova ad aprire l'app con uno schema; se non risponde entro il timeout,
   va allo store corretto in base al sistema operativo. */
function tryOpenApp(scheme, iosStore, androidStore){

    let store = isIOS() ? iosStore : androidStore;

    let left = false;
    document.addEventListener("visibilitychange", function onVis(){
        if(document.visibilityState === "hidden"){
            left = true;
            document.removeEventListener("visibilitychange", onVis);
        }
    });

    window.location = scheme;

    setTimeout(function(){
        if(!left){
            window.location = store;
        }
    }, 1500);
}

/* TEAMS - verificato */
function openTeams(){
    tryOpenApp(
        "msteams://",
        "https://apps.apple.com/it/app/microsoft-teams/id1113153706",
        "https://play.google.com/store/apps/details?id=com.microsoft.teams"
    );
}

/* OUTLOOK - verificato */
function openOutlook(){
    tryOpenApp(
        "ms-outlook://",
        "https://apps.apple.com/it/app/microsoft-outlook/id951937596",
        "https://play.google.com/store/apps/details?id=com.microsoft.office.outlook"
    );
}

/* AUTHPOINT - store verificati, schema non ufficiale (tentativo) */
function openAuthPoint(){
    tryOpenApp(
        "authpoint://",
        "https://apps.apple.com/us/app/watchguard-authpoint/id1335115425",
        "https://play.google.com/store/apps/details?id=com.watchguard.authpoint"
    );
}

/* ZCONNECT - store verificati, schema non ufficiale (tentativo) */
function openZConnect(){
    tryOpenApp(
        "zconnect://",
        "https://apps.apple.com/it/app/zconnect-enterprise-edition/id1254381259",
        "https://play.google.com/store/apps/details?id=com.zucchetti.hr.hrsuite&hl=it"
    );
}

/* PERFETTO APP - store verificati (ID corretto), schema non ufficiale (tentativo) */
function openPerfetto(){
    tryOpenApp(
        "myperfetto://",
        "https://apps.apple.com/us/app/my-perfetto/id1328294353",
        "https://play.google.com/store/apps/details?id=it.antos.perfettoapp"
    );
}

</script>

</body>

</html>
