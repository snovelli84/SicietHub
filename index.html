<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SICIET HUB</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#005baa;
    color:white;
    text-align:center;
    padding:25px;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:10px;
}

.container{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px 15px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.icon{
    font-size:50px;
}

.title{
    margin-top:10px;
    font-weight:bold;
    color:#333;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
    font-size:12px;
}

</style>

</head>

<body>

<header>
    <h1>SICIET</h1>
    <p>Portale Applicazioni Aziendali</p>
</header>

<div class="container">

    <div class="grid">

        <div class="card" onclick="openPerfetto()">
            <div class="icon">🏢</div>
            <div class="title">PerfettoApp</div>
        </div>

        <div class="card" onclick="openZConnect()">
            <div class="icon">💰</div>
            <div class="title">ZConnect</div>
        </div>

        <div class="card" onclick="openOutlook()">
            <div class="icon">📧</div>
            <div class="title">Outlook</div>
        </div>

        <div class="card" onclick="openTeams()">
            <div class="icon">💬</div>
            <div class="title">Teams</div>
        </div>

        <div class="card" onclick="openAuthPoint()">
            <div class="icon">🔐</div>
            <div class="title">AuthPoint</div>
        </div>

    </div>

</div>

<footer>
    SICIET HUB
</footer>

<script>

function isIOS(){
    return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

/* TEAMS */

function openTeams(){

    let store = isIOS()
        ? "https://apps.apple.com/it/app/microsoft-teams/id1113153706"
        : "https://play.google.com/store/apps/details?id=com.microsoft.teams";

    window.location="msteams://";

    setTimeout(function(){
        window.location=store;
    },1500);
}

/* OUTLOOK */

function openOutlook(){

    let store = isIOS()
        ? "https://apps.apple.com/it/app/microsoft-outlook/id951937596"
        : "https://play.google.com/store/apps/details?id=com.microsoft.office.outlook";

    window.location="ms-outlook://";

    setTimeout(function(){
        window.location=store;
    },1500);
}

/* AUTHPOINT */

function openAuthPoint(){

    let store = isIOS()
        ? "https://apps.apple.com/it/search?term=watchguard%20authpoint"
        : "https://play.google.com/store/search?q=watchguard+authpoint&c=apps";

    window.location="authpoint://";

    setTimeout(function(){
        window.location=store;
    },1500);
}

/* ZCONNECT */

function openZConnect(){

    window.open(
        "https://zconnect.zucchetti.it",
        "_blank"
    );
}

/* PERFETTO APP */

function openPerfetto(){

    if(isIOS()){
        window.open(
            "https://apps.apple.com/it/search?term=antos%20myperfetto",
            "_blank"
        );
    }else{
        window.open(
            "https://play.google.com/store/search?q=antos+perfettoapp&c=apps",
            "_blank"
        );
    }
}

</script>

</body>

</html>
