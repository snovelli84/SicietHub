<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#005baa">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SICIET ShareDocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Oxanium:wght@800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra di commessa in alto, schede operative, registro a tabella; i transmittal si aprono in un pannello laterale come un foglio tecnico. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --ink:#16202c; --muted:#5b6775; --line:#d6dce4; --line-strong:#aeb8c5;
  --accent:#1b4f8f; --accent-ink:#ffffff; --accent-soft:#e2eaf5;
  --ok:#1d7347; --ok-soft:#e1f1e8; --warn:#9a5a00; --warn-soft:#fbefdb; --bad:#b0261d; --bad-soft:#f9e3e1;
  --pend:#2b5ea6; --pend-soft:#e3ecf9; --info:#4e5d70; --info-soft:#e8ecf1;
  --shadow:0 12px 40px rgba(16,32,52,.18);
  --logo-plate:transparent; --brand-grad:linear-gradient(90deg,#1472B8 0%,#3C8F8C 50%,#82BA3A 100%); --brand-rule:linear-gradient(180deg,#1472B8 0%,#82BA3A 100%);
  --f-brand:"Oxanium","Archivo",Arial,sans-serif;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c25; --sunk:#1b242f; --ink:#e4e9f0; --muted:#97a3b2; --line:#29333f; --line-strong:#3c4856;
  --accent:#7eaaf0; --accent-ink:#0b1420; --accent-soft:#1b2a3e;
  --ok:#62c48f; --ok-soft:#15291f; --warn:#e6a548; --warn-soft:#2e2412; --bad:#f2837a; --bad-soft:#331a18;
  --pend:#8db3f2; --pend-soft:#17253a; --info:#a5b3c5; --info-soft:#1e2731; --shadow:0 12px 40px rgba(0,0,0,.5); --logo-plate:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c25; --sunk:#1b242f; --ink:#e4e9f0; --muted:#97a3b2; --line:#29333f; --line-strong:#3c4856;
  --accent:#7eaaf0; --accent-ink:#0b1420; --accent-soft:#1b2a3e;
  --ok:#62c48f; --ok-soft:#15291f; --warn:#e6a548; --warn-soft:#2e2412; --bad:#f2837a; --bad-soft:#331a18;
  --pend:#8db3f2; --pend-soft:#17253a; --info:#a5b3c5; --info-soft:#1e2731; --shadow:0 12px 40px rgba(0,0,0,.5); --logo-plate:#ffffff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* Top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.top .toggles{display:flex;gap:6px;flex:none;align-items:center}
.who{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;max-width:220px;overflow:hidden;white-space:nowrap}
.job select{font:inherit;font-family:var(--f-mono);font-size:12px;font-weight:600;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);padding:2px 4px;max-width:240px}
.top .lockup{text-decoration:none}
.lockup{display:inline-flex;align-items:center;gap:10px;background:var(--logo-plate);border-radius:8px;padding:4px 10px 4px 6px}
.lockup img{height:30px;width:auto;display:block}
.lockup .rule{width:2px;height:26px;border-radius:1px;background:var(--brand-rule)}
.lockup .wm{font-family:var(--f-brand);font-weight:800;font-size:19px;line-height:1;letter-spacing:2px;text-transform:uppercase;background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.job{display:flex;flex-direction:column;line-height:1.25;padding-left:14px;border-left:1px solid var(--line);min-width:0;max-width:240px}
.job b,.job span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job b{font-family:var(--f-mono);font-size:12px;font-weight:600}
.job span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--surface);padding:5px 9px;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button+button{border-left:1px solid var(--line-strong)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--surface)}

main{padding-block:24px 40px}
.appver{text-align:center;color:var(--muted);font-size:12px;padding-block:0 28px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:24px;font-weight:700}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.link:hover{text-decoration:underline}

/* Status chip */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap;background:var(--info-soft);color:var(--info)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)}
.t-pend{background:var(--pend-soft);color:var(--pend)} .t-info{background:var(--info-soft);color:var(--info)} .t-muted{background:var(--sunk);color:var(--muted)}
.demo{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line-strong);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.code{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:4px;font-family:var(--f-mono);font-weight:600;font-size:12px;border:1.5px solid currentColor}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--line-strong)}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi.alert .v{color:var(--bad)} .kpi.warnv .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>h2{font-size:15px;font-weight:700;padding:14px 16px 0}
.panel .sub{padding:2px 16px 10px;color:var(--muted);font-size:13px;margin:0}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.todo .what{min-width:0}
.todo .what b{font-weight:600;display:block;overflow-wrap:anywhere}
.todo .what span{font-size:12.5px;color:var(--muted)}
.stripe{width:4px;align-self:stretch;border-radius:2px;background:currentColor}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:6px 16px 12px;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0 16px 14px;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend li .sw{width:10px;height:10px;border-radius:2px;flex:none}
.legend li .c{margin-left:auto;font-family:var(--f-mono)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Tables */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 10px}
.toolbar input[type=search]{min-width:220px;flex:1 1 220px;max-width:360px}
.toolbar .count{margin-left:auto;color:var(--muted);font-size:13px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--sunk)}
td.num{white-space:nowrap}
.hist{display:flex;gap:4px;flex-wrap:wrap}
.hist span{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--sunk);white-space:nowrap}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(880px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.drawer .dh h2{font-size:17px;font-weight:700;margin-right:auto}
.drawer .db{overflow:auto;padding:20px;flex:1}
.form{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.form>*{min-width:0}
.drawer .db>*{max-width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,td select,td input,td textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 9px;font-weight:400;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:64px}
td select,td input{padding:4px 6px;min-width:62px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:13.5px}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}

/* Transmittal sheet */
.sheet{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:2px;padding:22px 24px;font-size:13px}
.sh-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;border-bottom:2px solid var(--ink);padding-bottom:12px}
.sh-brand{display:grid;gap:4px;justify-items:start}
.sh-brand .lockup{padding:4px 10px 4px 4px;gap:12px}
.sh-brand .lockup img{height:46px}
.sh-brand .lockup .rule{height:38px;width:3px}
.sh-brand .lockup .wm{font-size:24px;letter-spacing:3px}
.sh-brand small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sh-title{text-align:right}
.file{display:grid;gap:2px;font-size:13px;min-width:0}
.file .fname{font-size:12px;overflow-wrap:anywhere}
.file .sp{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.fileinput{font-size:12px;max-width:100%}
.sh-files{margin-top:14px;font-size:12px;display:grid;gap:2px}
.sh-files b{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.notice.preview{border-color:var(--pend);background:var(--pend-soft);margin-bottom:16px}
a.btn{text-decoration:none;color:var(--ink)}
a.btn:hover{text-decoration:none}
.allegati{display:grid;gap:6px;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.allegati .lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pdfview{display:block;width:100%;height:calc(100vh - 150px);min-height:420px;border:1px solid var(--line);border-radius:6px;background:#fff}
.sh-co{font-size:10.5px;line-height:1.45;color:var(--muted);margin-bottom:10px}
.sh-co b{color:var(--ink)}
.sh-title .k{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:13px}
.sh-title .no{font-family:var(--f-mono);font-size:20px;font-weight:600}
.sh-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line-strong);border-top:0}
.sh-meta div{padding:7px 10px;border-top:1px solid var(--line-strong);min-width:0}
.sh-meta div:nth-child(odd){border-right:1px solid var(--line-strong)}
.sh-meta i{display:block;font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sh-meta b{font-weight:600;overflow-wrap:anywhere}
.sheet table{margin-top:14px;border:1px solid var(--line-strong)}
.sheet th{background:var(--sunk);font-size:10px;position:static}
.sheet th,.sheet td{border:1px solid var(--line-strong);padding:6px 8px}
.sh-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;font-size:11.5px}
.sh-legend b{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sh-legend div div{display:flex;gap:6px}
.sh-sign{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:22px}
.sh-sign div{border-top:1px solid var(--ink);padding-top:4px;font-size:11px;color:var(--muted)}
.stamp{display:inline-block;transform:rotate(-4deg);border:2px solid currentColor;border-radius:4px;padding:2px 8px;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:12px;text-transform:uppercase}

/* Comments */
.cmt-reply{display:grid;gap:6px;min-width:240px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:40;font-weight:500;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}

@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .top .toggles{margin-left:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .job{border-left:0;padding-left:0}
  nav.tabs{margin-left:0;width:100%}
  .sh-meta,.sh-legend,.sh-sign{grid-template-columns:minmax(0,1fr)}
  .sh-meta div:nth-child(odd){border-right:0}
  .sheet{padding:16px}
  .drawer .db{padding:14px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="lockup" href="#cruscotto" aria-label="SICIET ShareDocs, vai al cruscotto"><img src="icons/siciet-mark.png" alt="SICIET" width="55" height="30"><span class="rule"></span><span class="wm">ShareDocs</span></a>
    <div class="job"><b id="jobCode"></b><span id="jobClient"></span></div>
    <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
    <div class="toggles"><span class="who" id="who"></span><div class="lang" id="modeBox" role="group" aria-label="Vista / View" hidden><button type="button" data-view-mode="siciet" aria-pressed="true">SICIET</button><button type="button" data-view-mode="client" aria-pressed="false">Client</button></div>
    <div class="lang" id="langBox" role="group" aria-label="Lingua / Language"><button type="button" data-lang="it" aria-pressed="false">IT</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Caricamento… / Loading…</div></main>
<!-- Aumentare versione e data a ogni modifica pubblicata, insieme a VERSIONE in sharedoc.js e a ?v= qui sotto. -->
<footer class="wrap appver">SICIET ShareDocs · versione 5 · 06/11/2026</footer>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script src="sharedoc.js?v=5"></script>
</body>
</html>
